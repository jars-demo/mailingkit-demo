[project]
name = "mailingkit"
version = "0.1.0"
description = "A drop-in, provider-agnostic transactional email layer for Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jishanahmed AR Shaikh (JARS)", email = "jishanahmedshaikh@gmail.com" }]
maintainers = [{ name = "Jishanahmed AR Shaikh (JARS)", email = "jishanahmedshaikh@gmail.com" }]
keywords = ["email", "transactional-email", "smtp", "resend", "templates", "asyncio", "django", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["jinja2>=3.1.4"]

[project.optional-dependencies]
resend = ["httpx>=0.27"]

[project.urls]
Homepage = "https://mailingkit.jishanahmed.in"
Documentation = "https://mailingkit.jishanahmed.in"
Repository = "https://github.com/jars-demo/mailingkit-demo"
Issues = "https://github.com/jars-demo/mailingkit-demo/issues"
Changelog = "https://github.com/jars-demo/mailingkit-demo/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "django>=5.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailingkit"]

[tool.hatch.build.targets.sdist]
include = ["src/mailingkit", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"examples/**" = ["S104", "S105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mailingkit"]

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true
