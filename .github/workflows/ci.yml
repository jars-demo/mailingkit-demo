name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest

  package:
    name: Build and smoke test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Core install works without optional dependencies
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import sys, mailingkit
          from mailingkit.providers import ConsoleProvider, SmtpProvider
          assert 'django' not in sys.modules and 'httpx' not in sys.modules
          print('mailingkit', mailingkit.__version__, 'imports cleanly')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
