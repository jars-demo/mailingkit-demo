# Publishes to PyPI when a version tag (v0.1.0, v0.2.0...) is pushed.
#
# Uses PyPI Trusted Publishing: no API token is stored in GitHub. Before the first release,
# add a trusted publisher on pypi.org for project "mailingkit", owner "jars-demo", repository
# "mailingkit-demo", workflow "release.yml", environment "pypi".

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mailingkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
